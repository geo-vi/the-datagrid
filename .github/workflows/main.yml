name: Publish Preview (GitHub Packages)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: {}

env:
  YARN_VERSION: 4.12.0

concurrency:
  group: publish-preview-github-packages
  cancel-in-progress: false

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack + pin Yarn
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate
          corepack yarn --version
          which yarn || true
          yarn --version || true

      - name: Resolve Yarn cache dir
        id: yarn-cache
        run: |
          DIR="$(corepack yarn config get cacheFolder | tr -d '\n' | sed 's/"//g')"
          echo "dir=${DIR}" >> "${GITHUB_OUTPUT}"
          echo "Yarn cacheFolder: ${DIR}"
          mkdir -p "${DIR}"

      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.yarn-cache.outputs.dir }}
            .yarn/unplugged
            .yarn/build-state.yml
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ env.YARN_VERSION }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ env.YARN_VERSION }}-

      - name: Install dependencies (immutable)
        run: corepack yarn install --immutable

      - name: Test (if present)
        run: |
          node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)" \
            && corepack yarn test \
            || echo "No test script; skipping."

      - name: Build (required)
        run: corepack yarn build

      - name: Patch package name for GitHub Packages (scoped)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          npm pkg set "name=@${OWNER}/the-datagrid"
          npm pkg set "publishConfig.registry=https://npm.pkg.github.com"

      - name: Set preview version (unique per run)
        id: version
        run: |
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          SHA="${GITHUB_SHA::7}"
          VERSION="0.0.0-preview.${TS}.${SHA}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          npm version --no-git-tag-version "${VERSION}"
          echo "Preview version: ${VERSION}"

      - name: Publish (GitHub Packages)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: corepack yarn npm publish --tag preview
