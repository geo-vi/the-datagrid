name: Publish Preview (GitHub Packages)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: {}

concurrency:
  group: publish-preview-github-packages
  cancel-in-progress: false

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install deps
        run: yarn install --immutable

      - name: Test (if present)
        run: |
          node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)" \
            && yarn test \
            || echo "No test script; skipping."

      - name: Build (required)
        run: yarn build

      - name: Prepare package for GitHub Packages publish (scoped name + Yarn auth)
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const owner = (process.env.GITHUB_REPOSITORY_OWNER || "").toLowerCase();
          if (!owner) throw new Error("Missing GITHUB_REPOSITORY_OWNER");

          // Patch package.json name to a scoped name required by GitHub Packages
          const pkgPath = path.join(process.cwd(), "package.json");
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));

          // Publish name in GitHub Packages MUST be scoped: @<owner>/<package>
          pkg.name = `@${owner}/the-datagrid`;

          // Optional but recommended: pin registry for publish
          pkg.publishConfig = { ...(pkg.publishConfig || {}), registry: "https://npm.pkg.github.com" };

          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          console.log("Prepared package.json name:", pkg.name);

          // Create a project-level .yarnrc.yml that points this scope to GitHub Packages.
          // Uses env substitution so the token isn't stored in the repo.
          const yarnrc = [
            "npmScopes:",
            `  ${owner}:`,
            '    npmRegistryServer: "https://npm.pkg.github.com"',
            "    npmAlwaysAuth: true",
            "    npmAuthToken: ${NODE_AUTH_TOKEN:-}",
            "",
          ].join("\n");

          fs.writeFileSync(path.join(process.cwd(), ".yarnrc.yml"), yarnrc);
          console.log("Wrote .yarnrc.yml for scope:", owner);
          NODE

      - name: Set preview version (unique per run)
        id: version
        run: |
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          SHA="${GITHUB_SHA::7}"
          VERSION="0.0.0-preview.${TS}.${SHA}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          npm version --no-git-tag-version "${VERSION}"
          echo "Preview version: ${VERSION}"

      - name: Publish (GitHub Packages)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn npm publish --tag preview
