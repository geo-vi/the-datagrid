name: Publish Packages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Stable version matching package.json and its v-prefixed Git tag; leave empty for a preview"
        type: string
        required: false
        default: ""

env:
  YARN_VERSION: 4.12.0
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}

concurrency:
  group: publish-preview-github-packages
  cancel-in-progress: false

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # REQUIRED for npm trusted publishing (OIDC)

    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate stable release target
        if: env.RELEASE_VERSION != ''
        run: |
          node <<'NODE'
          const version = process.env.RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(version) || require('./package.json').version !== version) {
            throw new Error('The requested stable version must match package.json.');
          }
          NODE
          test "$(git rev-parse "refs/tags/v${RELEASE_VERSION}^{commit}")" = "${GITHUB_SHA}"

      - name: Enable corepack + pin Yarn
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate
          corepack yarn --version
          which yarn || true
          yarn --version || true

      - name: Resolve Yarn cache dir
        id: yarn-cache
        run: |
          DIR="$(corepack yarn config get cacheFolder | tr -d '\n' | sed 's/"//g')"
          echo "dir=${DIR}" >> "${GITHUB_OUTPUT}"
          echo "Yarn cacheFolder: ${DIR}"
          mkdir -p "${DIR}"

      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.yarn-cache.outputs.dir }}
            .yarn/unplugged
            .yarn/build-state.yml
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ env.YARN_VERSION }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ env.YARN_VERSION }}-

      - name: Install dependencies (immutable)
        run: corepack yarn install --immutable

      - name: Unit tests
        run: corepack yarn test:unit

      - name: Build (required)
        run: corepack yarn build

      - name: Select package version and publish tag
        id: version
        run: |
          if [ -n "${RELEASE_VERSION}" ]; then
            echo "version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
            echo "tag=latest" >> "${GITHUB_OUTPUT}"
          else
            BASE_VERSION="$(node -p "require('./package.json').version")"
            TS="$(date -u +%Y%m%dT%H%M%SZ)"
            SHA="${GITHUB_SHA::7}"
            VERSION="${BASE_VERSION}-preview.${TS}.${SHA}"
            npm version --no-git-tag-version "${VERSION}"
            echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
            echo "tag=preview" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish (NPM Packages)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_TAG: ${{ steps.version.outputs.tag }}
        run: |
          npm pkg set "name=@geovi/the-datagrid"
          npm pkg set "publishConfig.registry=https://registry.npmjs.org"
          yarn config set -H npmPublishRegistry "https://registry.npmjs.org"
          yarn config set -H npmRegistryServer "https://registry.npmjs.org"
          yarn npm publish --tag "${PUBLISH_TAG}" --access public

      - name: Patch package name for GitHub Packages (scoped)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          npm pkg set "name=@${OWNER}/the-datagrid"
          npm pkg set "publishConfig.registry=https://npm.pkg.github.com"
          yarn config set -H 'npmRegistries["//npm.pkg.github.com"].npmAlwaysAuth' true
          yarn config set -H 'npmRegistries["//npm.pkg.github.com"].npmAuthToken' "${NODE_AUTH_TOKEN}"
          yarn config set -H npmPublishRegistry "https://registry.npmjs.org"
          yarn config set -H npmRegistryServer "https://registry.npmjs.org"

      - name: Publish (GitHub Packages)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_TAG: ${{ steps.version.outputs.tag }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          npm pkg set "name=@${OWNER}/the-datagrid"
          npm pkg set "publishConfig.registry=https://npm.pkg.github.com"
          yarn config set -H 'npmRegistries["//npm.pkg.github.com"].npmAlwaysAuth' true
          yarn config set -H 'npmRegistries["//npm.pkg.github.com"].npmAuthToken' "${NODE_AUTH_TOKEN}"
          yarn config set -H npmPublishRegistry "https://registry.npmjs.org"
          yarn config set -H npmRegistryServer "https://registry.npmjs.org"
          corepack yarn npm publish --tag "${PUBLISH_TAG}"
