name: Publish Preview Version

on:
  push:
    branches:
      - main
      - master

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Install dependencies
        run: npm ci

      - name: Generate preview version
        id: version
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          PREVIEW_VERSION="0.0.0-preview.${TIMESTAMP}.${SHORT_SHA}"
          echo "version=${PREVIEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Preview version: ${PREVIEW_VERSION}"

      - name: Update package.json version and name
        run: |
          # Update version
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          # Update package name for GitHub Packages (scoped to owner)
          npm pkg set name="@${{ github.repository_owner }}/the-datagrid"

      - name: Build package
        run: npm run build

      - name: Publish to GitHub Packages
        run: |
          npm publish --tag preview
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore package.json name
        run: |
          npm pkg set name="the-datagrid"

      - name: Commit and push version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --staged --quiet || git commit -m "chore: bump preview version to ${{ steps.version.outputs.version }} [skip ci]"
          git push || echo "Nothing to push or push failed"
