name: Publish Release Version

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Update package.json version and name
        run: |
          # Update version
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version
          # Update package name for GitHub Packages (scoped to owner)
          npm pkg set name="@${{ github.repository_owner }}/the-datagrid"

      - name: Build package
        run: npm run build

      - name: Publish to GitHub Packages
        run: |
          npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore package.json name
        run: |
          npm pkg set name="the-datagrid"
